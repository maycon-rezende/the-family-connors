<body class="intro-page world-locked">
  <main class="awakening" aria-labelledby="introTitle">
    <div class="intro-cursor" aria-hidden="true"><i></i><b></b><span>RASTREAR</span></div>
    <div class="intro-stage" aria-hidden="true"></div>
    <div class="intro-atmosphere" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="intro-flash" aria-hidden="true"></div>
    <div class="intro-letterbox" aria-hidden="true"><i></i><i></i></div>
    <header class="intro-signal"><span>TRANSMISSÃO EDE-01</span><b id="introStatus">SINAL LOCALIZADO</b></header>
    <section class="intro-copy" aria-live="polite">
      <p id="introKicker">ARQUIVO CORROMPIDO // ANTES DO DIA D</p>

      <p id="introCaption">A última transmissão começa antes do fim.</p>

      <p>Uma memória sobreviveu ao fim do mundo.</p>
      <button type="button" data-start-cinema><span>INICIAR TRANSMISSÃO</span><i>→</i></button>

    <section class="intro-final" aria-label="A Era da Extinção">
      <p>O MUNDO CONHECEU AQUILO QUE RESTOU COMO</p>

      <button type="button" data-awaken><span>ACORDAR NO PRESENTE</span><i>→</i></button>
    </section>
    <footer class="intro-controls">
      <span id="cinemaTimecode">00:00:00</span>
      <div class="intro-progress"><i></i></div>
      <button type="button" data-toggle-sound aria-pressed="true">SOM // ON</button>
      <button type="button" data-skip-cinema>PULAR</button>
    </footer>
  </main>
  <audio id="introReferenceAudio" preload="auto" playsinline src="audio/intro-ultron-reference.mp3"></audio>
